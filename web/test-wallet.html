<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1F2348">
    <title>PROOF Wallet Connection Test</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F2348'/%3E%3Cpath transform='translate(7 7) scale(.78)' d='M62.3 25.4L49.2 2.6A5.3 5.3 0 0 0 44.6 0H18.4c-1.9 0-3.6 1-4.6 2.6L.7 25.4c-1 1.6-1 3.6 0 5.2l13.1 22.8c1 1.6 2.7 2.6 4.6 2.6h26.2c1.9 0 3.6-1 4.6-2.6l13-22.8c1-1.6 1-3.6.1-5.2z' fill='%23E9B213'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Muli:wght@400;600;700;800&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Nimiq UI Kit tokens (nimiqtoolbox.github.io/nimiq-ui-kit) */
        :root {
            --nimiq-blue: #1F2348;
            --nimiq-light-blue: #0582CA;
            --nimiq-gold: #E9B213;
            --nimiq-green: #21BCA5;
            --nimiq-orange: #FC8702;
            --nimiq-red: #D94432;
            --nimiq-gray: #F4F4F4;
            --nimiq-light-gray: #FAFAFA;
            --nimiq-font: 'Muli', -apple-system, 'Segoe UI', Roboto, sans-serif;
            --nimiq-font-mono: 'Fira Mono', monospace;
            --nimiq-ease: cubic-bezier(0.25, 0, 0, 1);
        }
        body { font-family: var(--nimiq-font); color: var(--nimiq-blue); background: var(--nimiq-light-gray); padding: 40px 20px; max-width: 800px; margin: 0 auto; line-height: 1.5; }
        h1 { font-size: 24px; margin: 0 0 8px; }
        h2 { font-size: 20px; margin: 28px 0 4px; }
        p.sub { color: rgba(31,35,72,.6); margin: 0 0 12px; }
        .status { padding: 12px 16px; margin: 10px 0; border-radius: 10px; font-size: 14px; font-weight: 600; }
        .success { background: rgba(33,188,165,.12); color: #17857A; }
        .error { background: rgba(217,68,50,.1); color: var(--nimiq-red); }
        .info { background: rgba(5,130,202,.09); color: #0071C3; }
        button {
            font-family: var(--nimiq-font); font-weight: 700; font-size: 14px; color: #fff;
            background: radial-gradient(100% 100% at bottom right, #260133, var(--nimiq-blue));
            background-color: var(--nimiq-blue);
            border: 0; border-radius: 500px; min-height: 40px; padding: 10px 22px; margin: 6px 8px 6px 0; cursor: pointer;
            transition: filter .2s var(--nimiq-ease), transform .12s var(--nimiq-ease);
        }
        button:hover { filter: brightness(1.2); }
        button:active { transform: scale(.97); }
        #log { background: var(--nimiq-blue); color: #E4E8FF; padding: 16px 18px; border-radius: 10px; white-space: pre-wrap; font-family: var(--nimiq-font-mono); font-size: 12.5px; line-height: 1.7; box-shadow: 0 4px 28px rgba(0,0,0,.11); }
        .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .18em; font-size: 13px; color: rgba(31,35,72,.6); }
        .logo svg { width: 16px; height: 18px; }
    </style>
</head>
<body>
    <h1>PROOF Wallet Connection Test</h1>
    <span class="logo"><svg viewBox="0 -4 64 64" aria-hidden="true"><path d="M62.3 25.4L49.2 2.6A5.3 5.3 0 0 0 44.6 0H18.4c-1.9 0-3.6 1-4.6 2.6L.7 25.4c-1 1.6-1 3.6 0 5.2l13.1 22.8c1 1.6 2.7 2.6 4.6 2.6h26.2c1.9 0 3.6-1 4.6-2.6l13-22.8c1-1.6 1-3.6.1-5.2z" fill="#E9B213"/></svg> BUILT ON NIMIQ</span>
    <p class="sub">Verify Hub, Nimiq Pay and demo-wallet connectivity for this environment.</p>
    
    <div class="status info">
        <strong>Environment:</strong> 
        <span id="env">Detecting...</span>
    </div>
    
    <h2>Test Connections:</h2>
    <button onclick="testBasicAPI()">Test Basic API</button>
    <button onclick="testHub()">Test Nimiq Hub</button>
    <button onclick="testPay()">Test Nimiq Pay</button>
    <button onclick="testDemo()">Test Demo Wallet</button>
    <button onclick="testFullAuth()">Test Full Auth Flow</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <h3>Connection Log:</h3>
    <div id="log"></div>
    
    <script>
        const log = (msg, type = 'info') => {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
            logEl.innerHTML += `<div style="color: ${color}">[${timestamp}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        };
        
        const clearLog = () => {
            document.getElementById('log').innerHTML = '';
        };
        
        // Test basic API connectivity
        async function testBasicAPI() {
            log('🔵 Testing Basic API Connectivity...', 'info');
            
            // Test GET /api/me (should work without auth)
            try {
                log('Testing GET /api/me...', 'info');
                const resp = await fetch('/api/me');
                log(`Status: ${resp.status} ${resp.statusText}`, resp.ok ? 'success' : 'error');
                const data = await resp.json();
                log(`Response: ${JSON.stringify(data).slice(0, 100)}`, 'info');
            } catch (e) {
                log(`GET /api/me failed: ${e.message}`, 'error');
            }
            
            // Test POST /api/wallet/demo
            try {
                log('Testing POST /api/wallet/demo...', 'info');
                const resp = await fetch('/api/wallet/demo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                log(`Status: ${resp.status} ${resp.statusText}`, resp.ok ? 'success' : 'error');
                log(`Headers: ${JSON.stringify([...resp.headers.entries()])}`, 'info');
                const text = await resp.text();
                log(`Response (first 200 chars): ${text.slice(0, 200)}`, text ? 'info' : 'error');
                
                if (resp.ok && text) {
                    log('✅ POST /api/wallet/demo works!', 'success');
                } else {
                    log('❌ POST /api/wallet/demo failed', 'error');
                }
            } catch (e) {
                log(`POST /api/wallet/demo failed: ${e.message}`, 'error');
            }
            
            // Test POST /api/auth/nonce
            try {
                log('Testing POST /api/auth/nonce...', 'info');
                const resp = await fetch('/api/auth/nonce', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject: 'test-subject-123' })
                });
                log(`Status: ${resp.status} ${resp.statusText}`, resp.ok ? 'success' : 'error');
                const text = await resp.text();
                log(`Response (first 200 chars): ${text.slice(0, 200)}`, text ? 'info' : 'error');
                
                if (resp.ok && text) {
                    log('✅ POST /api/auth/nonce works!', 'success');
                } else {
                    log('❌ POST /api/auth/nonce failed', 'error');
                }
            } catch (e) {
                log(`POST /api/auth/nonce failed: ${e.message}`, 'error');
            }
        }
        
        
        // Detect environment
        const detectEnv = () => {
            const envEl = document.getElementById('env');
            if (window.nimiqPay?.active) {
                envEl.textContent = '✅ Inside Nimiq Pay App';
                envEl.parentElement.className = 'status success';
            } else if (window.NimiqMiniApp) {
                envEl.textContent = '✅ Nimiq Mini App detected';
                envEl.parentElement.className = 'status success';
            } else {
                envEl.textContent = '🌐 Regular Browser (Hub only)';
                envEl.parentElement.className = 'status info';
            }
        };
        
        // Test Nimiq Hub
        async function testHub() {
            log('🔵 Testing Nimiq Hub...', 'info');
            try {
                // Load Hub API
                log('Loading Hub API...', 'info');
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@nimiq/hub-api@v1.10.0/dist/standalone/HubApi.standalone.umd.js';
                script.onload = async () => {
                    log('✅ Hub API loaded', 'success');
                    
                    const hubApi = new HubApi('https://hub.nimiq.com');
                    log('Hub API initialized', 'info');
                    
                    // Step 1: Choose address
                    log('Opening Hub to choose address...', 'info');
                    const { address } = await hubApi.chooseAddress({ appName: 'PROOF Test' });
                    log(`✅ Address selected: ${address}`, 'success');
                    
                    // Step 2: Sign message
                    const message = 'PROOF Test - ' + new Date().toISOString();
                    log(`Requesting signature for: "${message}"`, 'info');
                    const signed = await hubApi.signMessage({
                        appName: 'PROOF Test',
                        message,
                        signer: address
                    });
                    log(`✅ Message signed!`, 'success');
                    log(`Public Key: ${Array.from(signed.signerPublicKey, b => b.toString(16).padStart(2, '0')).join('')}`, 'info');
                    log(`Signature: ${Array.from(signed.signature, b => b.toString(16).padStart(2, '0')).join('')}`, 'info');
                    
                    log('🎉 Nimiq Hub connection works!', 'success');
                };
                script.onerror = () => {
                    log('❌ Failed to load Hub API', 'error');
                };
                document.head.appendChild(script);
            } catch (error) {
                log(`❌ Hub test failed: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        // Test Nimiq Pay
        async function testPay() {
            log('🔵 Testing Nimiq Pay...', 'info');
            try {
                // Check environment first
                log(`window.nimiqPay: ${window.nimiqPay ? 'present' : 'not present'}`, 'info');
                log(`window.nimiqPay?.active: ${window.nimiqPay?.active}`, 'info');
                log(`window.NimiqMiniApp: ${window.NimiqMiniApp ? 'present' : 'not present'}`, 'info');
                
                if (!window.nimiqPay?.active && !window.NimiqMiniApp) {
                    log('⚠️ Not inside Nimiq Pay app.', 'error');
                    log('ℹ️ To test Nimiq Pay:', 'info');
                    log('1. Install Nimiq Pay app from https://www.nimiq.com/pay/', 'info');
                    log('2. Open this URL inside the Nimiq Pay app', 'info');
                    log('3. The app will inject the provider', 'info');
                    return;
                }
                
                // Try loading SDK
                log('✅ Inside Nimiq Pay environment!', 'success');
                log('Loading Nimiq Pay SDK...', 'info');
                const SDK_URLS = [
                    'https://esm.sh/@nimiq/mini-app-sdk@latest',
                    'https://cdn.jsdelivr.net/npm/@nimiq/mini-app-sdk/+esm',
                    'https://unpkg.com/@nimiq/mini-app-sdk@latest/+esm'
                ];
                
                for (const url of SDK_URLS) {
                    try {
                        log(`Trying SDK from: ${url}`, 'info');
                        const mod = await import(url);
                        if (mod?.init) {
                            log('✅ SDK loaded, initializing...', 'success');
                            const nimiq = await mod.init();
                            log('✅ SDK initialized', 'success');
                            
                            const accounts = await nimiq.listAccounts();
                            log(`✅ Accounts: ${JSON.stringify(accounts)}`, 'success');
                            
                            // Try signing a test message
                            const testMsg = 'PROOF Test - ' + new Date().toISOString();
                            log(`Signing test message...`, 'info');
                            const signature = await nimiq.sign(testMsg);
                            log(`✅ Message signed: ${signature}`, 'success');
                            
                            log('🎉 Nimiq Pay connection works!', 'success');
                            return;
                        }
                    } catch (e) {
                        log(`Failed with ${url}: ${e.message}`, 'error');
                    }
                }
                
                log('❌ Could not load Nimiq Pay SDK', 'error');
            } catch (error) {
                log(`❌ Pay test failed: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        // Test Demo Wallet
        async function testDemo() {
            log('🔵 Testing Demo Wallet...', 'info');
            try {
                // Step 1: Create demo wallet
                log('Creating demo wallet...', 'info');
                const response = await fetch('/api/wallet/demo', { method: 'POST' });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server returned ${response.status}: ${errorText}`);
                }
                
                const demo = await response.json();
                log(`✅ Demo wallet created`, 'success');
                log(`Public Key: ${demo.publicKey}`, 'info');
                
                // Step 2: Get nonce
                log('Requesting nonce...', 'info');
                const nonceResp = await fetch('/api/auth/nonce', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject: demo.publicKey })
                });
                const { nonce, message } = await nonceResp.json();
                log(`✅ Nonce received: ${nonce}`, 'success');
                
                // Step 3: Sign message
                log(`Signing message...`, 'info');
                const signResp = await fetch('/api/wallet/demo/sign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ privateKey: demo.privateKey, message })
                });
                const { signature } = await signResp.json();
                log(`✅ Message signed`, 'success');
                
                // Step 4: Verify and authenticate
                log('Verifying signature and creating session...', 'info');
                const verifyResp = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mode: 'demo',
                        nonce,
                        publicKey: demo.publicKey,
                        signature
                    })
                });
                
                if (!verifyResp.ok) {
                    const error = await verifyResp.text();
                    throw new Error(`Verification failed: ${error}`);
                }
                
                const result = await verifyResp.json();
                log(`✅ Authentication successful!`, 'success');
                log(`User ID: ${result.user.id}`, 'success');
                log(`Username: ${result.user.username}`, 'success');
                
                log('🎉 Demo wallet works!', 'success');
            } catch (error) {
                log(`❌ Demo test failed: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        // Test Full Auth Flow with Hub
        async function testFullAuth() {
            log('🔵 Testing Full Hub Authentication Flow...', 'info');
            try {
                // Load Hub API if not already loaded
                if (!window.HubApi) {
                    log('Loading Hub API...', 'info');
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/@nimiq/hub-api@v1.10.0/dist/standalone/HubApi.standalone.umd.js';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                    log('✅ Hub API loaded', 'success');
                }
                
                const hubApi = new HubApi('https://hub.nimiq.com');
                
                // Step 1: Choose address
                log('Opening Hub to choose address...', 'info');
                const { address } = await hubApi.chooseAddress({ appName: 'PROOF Test' });
                log(`✅ Address selected: ${address}`, 'success');
                
                // Step 2: Get nonce from server
                log('Requesting nonce from server...', 'info');
                log(`Request: POST /api/auth/nonce`, 'info');
                const nonceResp = await fetch('/api/auth/nonce', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject: address })
                });
                
                log(`Response status: ${nonceResp.status} ${nonceResp.statusText}`, 'info');
                log(`Response headers: ${JSON.stringify([...nonceResp.headers])}`, 'info');
                
                if (!nonceResp.ok) {
                    const errorText = await nonceResp.text();
                    log(`Response body: ${errorText}`, 'error');
                    throw new Error(`Server returned ${nonceResp.status}: ${errorText}`);
                }
                
                const { nonce, message } = await nonceResp.json();
                log(`✅ Nonce received: ${nonce}`, 'success');
                log(`Message to sign: ${message}`, 'info');
                
                // Step 3: Sign message via Hub
                log('Opening Hub to sign message...', 'info');
                const signed = await hubApi.signMessage({
                    appName: 'PROOF Test',
                    message,
                    signer: address
                });
                log(`✅ Message signed!`, 'success');
                
                // Convert Uint8Arrays to hex
                const publicKeyHex = Array.from(signed.signerPublicKey, b => b.toString(16).padStart(2, '0')).join('');
                const signatureHex = Array.from(signed.signature, b => b.toString(16).padStart(2, '0')).join('');
                
                log(`Public Key: ${publicKeyHex}`, 'info');
                log(`Signature: ${signatureHex}`, 'info');
                
                // Step 4: Verify with server
                log('Verifying signature with server...', 'info');
                const verifyResp = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mode: 'hub',
                        nonce,
                        address,
                        publicKey: publicKeyHex,
                        signature: signatureHex
                    })
                });
                
                if (!verifyResp.ok) {
                    const error = await verifyResp.text();
                    throw new Error(`Verification failed: ${error}`);
                }
                
                const result = await verifyResp.json();
                log(`✅ Authentication successful!`, 'success');
                log(`User ID: ${result.user.id}`, 'success');
                log(`Username: ${result.user.username}`, 'success');
                log(`Wallet: ${result.user.walletAddress}`, 'success');
                
                log('🎉 Full Hub authentication flow works!', 'success');
            } catch (error) {
                log(`❌ Full auth test failed: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        // Initialize
        detectEnv();
        log('Test page loaded. Click buttons to test connections.', 'info');
    </script>
</body>
</html>
